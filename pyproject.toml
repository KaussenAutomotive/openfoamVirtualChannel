[project]
name = "windtunnel"
version = "0.1.0"
description = "Virtueller Windkanal fuer Fahrzeuge auf Basis von OpenFOAM (WSL)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "numpy>=1.26",
    "gmsh>=4.12",
    "pyqtgraph>=0.13",
]

[project.gui-scripts]
windtunnel = "windtunnel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
